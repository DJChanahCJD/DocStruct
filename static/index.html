<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocStruct - 智能文档结构化</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['Outfit', 'sans-serif'], body: ['Work Sans', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Work Sans', sans-serif; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 selection:bg-brand-100 selection:text-brand-900" x-data="docStruct()">
    <div class="fixed inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 pointer-events-none z-0"></div>
    
    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 h-screen flex flex-col">
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-brand-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-brand-500/30">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 tracking-tight">DocStruct</h1>
                    <p class="text-xs text-slate-500 font-medium uppercase tracking-wider">MVP v1.0</p>
                </div>
            </div>
        </header>

        <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8 min-h-0">
            <div class="lg:col-span-4 flex flex-col gap-6 h-full min-h-0">
                <div class="glass-card rounded-2xl p-6 transition-all duration-300 hover:shadow-md max-h-56 overflow-y-auto">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center">
                        <span class="w-1.5 h-6 bg-brand-500 rounded-full mr-3"></span>上传文档
                    </h2>
                    
                    <div class="group border-2 border-dashed rounded-xl p-8 text-center transition-all duration-300 cursor-pointer relative"
                         :class="isDragging ? 'border-brand-500 bg-brand-50' : 'border-slate-200 hover:border-brand-500 hover:bg-brand-50/50'"
                         @dragover.prevent="isDragging = true" @dragleave.prevent="isDragging = false" @drop.prevent="handleDrop">
                        <input type="file" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept=".pdf,.docx,.md,.txt" @change="handleFile">
                        <div class="flex flex-col items-center pointer-events-none transition-transform group-hover:scale-105 duration-300">
                            <div class="w-12 h-12 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mb-3 group-hover:bg-brand-100 group-hover:text-brand-600 transition-colors">
                                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" /></svg>
                            </div>
                            <p class="text-sm font-medium text-slate-700">点击或拖拽文件</p>
                            <p class="text-xs text-slate-400 mt-1">支持 PDF, DOCX, MD, TXT</p>
                        </div>
                    </div>

                    <div x-show="file" x-transition x-cloak class="mt-4 space-y-3">
                        <div class="flex items-center justify-between bg-slate-50 px-3 py-2 rounded-lg border border-slate-100">
                            <div class="flex items-center overflow-hidden">
                                <span class="text-sm text-slate-700 truncate" x-text="file?.name"></span>
                            </div>
                            <button @click="file = null" class="text-slate-400 hover:text-red-500 p-1 rounded-full hover:bg-red-50 transition-colors">&times;</button>
                        </div>
                        <button @click="upload()" :disabled="loading" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-lg shadow-brand-500/20 active:scale-95 transition-all duration-200 disabled:opacity-50 flex items-center justify-center">
                            <span x-text="loading ? '提取中...' : '开始智能提取'"></span>
                        </button>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-6 transition-all duration-300 hover:shadow-md max-h-56 overflow-y-auto">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center">
                        <span class="w-1.5 h-6 bg-brand-500 rounded-full mr-3"></span>知识问答
                    </h2>
                    <textarea x-model="qaQuestion" rows="3" placeholder="输入问题，基于当前文档检索回答..." class="w-full text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-200"></textarea>
                    <div class="mt-3 flex items-center gap-2">
                        <input type="number" min="1" max="10" x-model.number="qaTopK" class="w-20 text-sm border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-brand-200">
                        <button @click="askQuestion()" :disabled="qaLoading || !qaQuestion.trim()" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2 px-3 rounded-lg disabled:opacity-50">
                            <span x-text="qaLoading ? '回答中...' : '提问'"></span>
                        </button>
                    </div>
                    <div x-show="qaAnswer" x-cloak class="mt-3 p-3 rounded-lg bg-slate-50 border border-slate-200 text-sm text-slate-700 whitespace-pre-wrap" x-text="qaAnswer"></div>
                    <div x-show="qaCitations.length > 0" x-cloak class="mt-3 max-h-36 overflow-y-auto custom-scrollbar space-y-2">
                        <template x-for="(c, idx) in qaCitations" :key="`${c.chunk_id}-${idx}`">
                            <div class="p-2 rounded-lg border border-slate-200 bg-white">
                                <div class="text-xs text-slate-500" x-text="`doc=${c.doc_id} chunk=${c.chunk_id} score=${c.score}`"></div>
                                <div class="text-xs text-slate-600 mt-1" x-text="c.snippet"></div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="glass-card rounded-2xl p-6 flex-1 flex flex-col min-h-0">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center justify-between">
                        <div class="flex items-center"><span class="w-1.5 h-6 bg-slate-300 rounded-full mr-3"></span>历史记录</div>
                        <span class="text-xs font-normal text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full" x-text="history.length"></span>
                    </h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3">
                        <input x-model="searchKeyword" type="text" placeholder="搜索文件名..." class="sm:col-span-2 text-sm border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-brand-200">
                        <select x-model="statusFilter" class="text-sm border border-slate-200 rounded-lg px-2 py-2 focus:outline-none focus:ring-2 focus:ring-brand-200">
                            <option value="">全部状态</option>
                            <option value="completed">completed</option>
                            <option value="processing">processing</option>
                            <option value="failed">failed</option>
                        </select>
                    </div>
                    <div class="overflow-y-auto custom-scrollbar flex-1 space-y-2 pr-1 -mr-1">
                        <template x-if="filteredHistory.length === 0">
                            <div class="flex flex-col items-center justify-center h-32 text-slate-400 text-sm">暂无历史记录</div>
                        </template>
                        <template x-for="item in filteredHistory" :key="item.id">
                            <div :id="`history-item-${item.id}`" @click="loadDoc(item.id)" class="group p-3 rounded-xl hover:bg-slate-50 cursor-pointer border transition-all duration-200"
                                :class="selectedDocId === item.id ? 'border-brand-300 bg-brand-50/60' : 'border-transparent hover:border-slate-200'">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="font-medium text-slate-700 truncate flex-1 mr-2 text-sm group-hover:text-brand-600 transition-colors" x-text="item.filename"></span>
                                    <div class="flex items-center gap-1.5 shrink-0">
                                        <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded border bg-slate-100 text-slate-600" x-text="item.doc_type || 'UNK'"></span>
                                        <button @click.stop="deleteDoc(item.id)" class="text-slate-300 hover:text-red-500 transition-colors p-0.5 rounded hover:bg-red-50" title="删除">
                                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="flex justify-between items-center text-xs text-slate-400">
                                    <span x-text="new Date(item.upload_time).toLocaleDateString()"></span>
                                    <span :class="item.status === 'completed' ? 'text-emerald-500' : 'text-amber-500'" x-text="item.status"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-8 h-full min-h-0 flex flex-col">
                <div class="glass-card rounded-2xl p-0 flex flex-col h-full overflow-hidden relative">
                    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white/50 backdrop-blur-sm">
                        <div class="flex items-center gap-2">
                            <h2 class="text-lg font-semibold text-slate-800">提取结果</h2>
                            <div x-show="currentDoc" x-cloak class="flex items-center gap-1 text-xs">
                                <button @click="activeTab = 'json'" class="px-2.5 py-1 rounded-md border transition-colors"
                                    :class="activeTab === 'json' ? 'border-brand-300 bg-brand-50 text-brand-700' : 'border-slate-200 text-slate-500'">结构化 JSON</button>
                                <button @click="activeTab = 'raw'" class="px-2.5 py-1 rounded-md border transition-colors"
                                    :class="activeTab === 'raw' ? 'border-brand-300 bg-brand-50 text-brand-700' : 'border-slate-200 text-slate-500'">原文预览</button>
                                <button @click="activeTab = 'error'" class="px-2.5 py-1 rounded-md border transition-colors"
                                    :class="activeTab === 'error' ? 'border-brand-300 bg-brand-50 text-brand-700' : 'border-slate-200 text-slate-500'">错误信息</button>
                            </div>
                        </div>
                        <div x-show="currentDoc" x-transition x-cloak class="flex space-x-2">
                            <button @click="reindexCurrent()" class="text-xs font-medium text-slate-600 bg-white border border-slate-200 hover:text-brand-600 px-3 py-1.5 rounded-lg transition-colors shadow-sm">重建索引</button>
                            <button @click="reloadCurrent()" class="text-xs font-medium text-slate-600 bg-white border border-slate-200 hover:text-brand-600 px-3 py-1.5 rounded-lg transition-colors shadow-sm">重新加载</button>
                            <button @click="copy()" class="text-xs font-medium text-slate-600 bg-white border border-slate-200 hover:text-brand-600 px-3 py-1.5 rounded-lg transition-colors shadow-sm">复制</button>
                            <button @click="download()" class="text-xs font-medium text-slate-600 bg-white border border-slate-200 hover:text-brand-600 px-3 py-1.5 rounded-lg transition-colors shadow-sm">下载</button>
                        </div>
                    </div>

                    <div class="flex-1 relative bg-slate-900 overflow-hidden">
                        <div x-show="loading" x-transition class="absolute inset-0 z-20 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center">
                            <div class="w-12 h-12 border-4 border-brand-100 border-t-brand-500 rounded-full animate-spin"></div>
                            <p class="mt-4 text-sm text-slate-500 animate-pulse" x-text="uploadStage || 'AI 正在分析文档...'"></p>
                        </div>

                        <div x-show="!currentDoc && !loading" x-transition class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 z-10 bg-slate-50">
                            <p class="text-sm font-medium">请在左侧上传或选择文档</p>
                        </div>

                        <div x-show="currentDoc && !loading && activeTab === 'json'" class="absolute inset-0 overflow-auto custom-scrollbar">
                            <template x-if="result">
                                <pre><code id="codeBlock" class="language-json text-sm font-mono leading-relaxed" x-text="resultStr"></code></pre>
                            </template>
                            <template x-if="!result">
                                <div class="h-full flex items-center justify-center bg-slate-50 text-slate-400 text-sm">当前记录无结构化结果</div>
                            </template>
                        </div>

                        <div x-show="currentDoc && !loading && activeTab === 'raw'" class="absolute inset-0 overflow-auto custom-scrollbar bg-slate-50">
                            <pre class="text-sm text-slate-700 font-mono leading-relaxed p-4 whitespace-pre-wrap" x-text="rawContent || '无解析原文'"></pre>
                        </div>

                        <div x-show="currentDoc && !loading && activeTab === 'error'" class="absolute inset-0 overflow-auto custom-scrollbar bg-slate-50">
                            <pre class="text-sm text-red-600 font-mono leading-relaxed p-4 whitespace-pre-wrap" x-text="errorContent || '无错误信息'"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 px-4 py-2 bg-slate-800 text-white text-sm font-medium rounded-full shadow-lg transition-all duration-300 z-50"
             :class="toast.show ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0'" x-text="toast.msg"></div>
    </div>

    <script>
        function docStruct() {
            return {
                file: null, isDragging: false, loading: false, result: null, history: [],
                currentDoc: null, selectedDocId: null, activeTab: 'json',
                searchKeyword: '', statusFilter: '', uploadStage: '',
                qaQuestion: '', qaAnswer: '', qaCitations: [], qaLoading: false, qaTopK: 5,
                toast: { show: false, msg: '' },
                
                get resultStr() { return this.result ? JSON.stringify(this.result, null, 2) : ''; },
                get rawContent() { return this.currentDoc?.parsed_content || ''; },
                get errorContent() { return this.currentDoc?.error_message || ''; },
                get filteredHistory() {
                    const keyword = this.searchKeyword.trim().toLowerCase();
                    return this.history.filter((item) => {
                        const matchName = !keyword || (item.filename || '').toLowerCase().includes(keyword);
                        const matchStatus = !this.statusFilter || item.status === this.statusFilter;
                        return matchName && matchStatus;
                    });
                },
                
                init() { 
                    this.fetchHistory(); 
                    // 监听 result 变化，自动触发 Prism 高亮
                    this.$watch('result', () => {
                        this.$nextTick(() => { if(this.result) Prism.highlightElement(document.getElementById('codeBlock')); });
                    });
                },
                
                handleFile(e) { if(e.target.files[0]) this.file = e.target.files[0]; },
                handleDrop(e) { 
                    this.isDragging = false; 
                    const file = e.dataTransfer.files[0];
                    if (file) {
                        const ext = file.name.split('.').pop().toLowerCase();
                        if (['pdf', 'docx', 'md', 'txt'].includes(ext)) {
                            this.file = file;
                        } else {
                            this.showToast('不支持的文件类型');
                        }
                    }
                },
                
                async upload() {
                    if (!this.file) return;
                    this.loading = true;
                    this.uploadStage = '上传中...';
                    const fd = new FormData(); fd.append('file', this.file);
                    try {
                        this.uploadStage = '处理中...';
                        const res = await fetch('/api/upload', { method: 'POST', body: fd });
                        if (!res.ok) throw new Error();
                        const data = await res.json();
                        await this.loadDoc(data.id, true);
                        await this.fetchHistory(data.id);
                        this.file = null;
                        this.showToast('解析成功');
                    } catch {
                        this.showToast('解析失败，请检查服务');
                    } finally {
                        this.loading = false;
                        this.uploadStage = '';
                    }
                },
                
                async loadDoc(id, forceJsonTab = false) {
                    this.loading = true;
                    try {
                        const res = await fetch(`/api/documents/${id}`);
                        this.currentDoc = await res.json();
                        this.result = this.currentDoc?.extracted_data || null;
                        this.selectedDocId = id;
                        if (forceJsonTab) this.activeTab = 'json';
                    } catch { this.showToast('获取数据失败'); }
                    finally { this.loading = false; }
                },

                async reloadCurrent() {
                    if (!this.selectedDocId) return;
                    await this.loadDoc(this.selectedDocId);
                },

                async reindexCurrent() {
                    if (!this.selectedDocId) {
                        this.showToast('请先选择文档');
                        return;
                    }
                    try {
                        const res = await fetch(`/api/reindex/${this.selectedDocId}`, { method: 'POST' });
                        if (!res.ok) throw new Error();
                        this.showToast('索引重建成功');
                    } catch {
                        this.showToast('索引重建失败');
                    }
                },

                async askQuestion() {
                    const question = this.qaQuestion.trim();
                    if (!question) return;
                    this.qaLoading = true;
                    this.qaAnswer = '';
                    this.qaCitations = [];
                    try {
                        const payload = {
                            question,
                            doc_id: this.selectedDocId || null,
                            top_k: this.qaTopK || 5
                        };
                        const res = await fetch('/api/qa', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data?.detail || '问答失败');
                        this.qaAnswer = data.answer || '';
                        this.qaCitations = data.citations || [];
                    } catch {
                        this.showToast('问答失败，请检查索引与模型配置');
                    } finally {
                        this.qaLoading = false;
                    }
                },

                async deleteDoc(id) {
                    if (!confirm('确定要删除此记录吗？')) return;
                    try {
                        const res = await fetch(`/api/documents/${id}`, { method: 'DELETE' });
                        if (res.ok) {
                            this.history = this.history.filter(h => h.id !== id);
                            if (this.selectedDocId === id) {
                                this.selectedDocId = null;
                                this.currentDoc = null;
                                this.result = null;
                            }
                            this.showToast('删除成功');
                        } else {
                            this.showToast('删除失败');
                        }
                    } catch { this.showToast('请求出错'); }
                },
                
                async fetchHistory(highlightId = null) {
                    try {
                        this.history = await (await fetch('/api/documents')).json();
                        if (highlightId) {
                            this.selectedDocId = highlightId;
                            this.$nextTick(() => {
                                const node = document.getElementById(`history-item-${highlightId}`);
                                if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            });
                        }
                    } catch(e){}
                },
                
                copy() {
                    const text = this.activeTab === 'raw' ? this.rawContent : (this.activeTab === 'error' ? this.errorContent : this.resultStr);
                    navigator.clipboard.writeText(text || '');
                    this.showToast('已复制到剪贴板');
                },
                
                download() {
                    const content = this.activeTab === 'raw' ? this.rawContent : (this.activeTab === 'error' ? this.errorContent : this.resultStr);
                    const mime = this.activeTab === 'json' ? 'application/json' : 'text/plain;charset=utf-8';
                    const ext = this.activeTab === 'json' ? 'json' : 'txt';
                    const blob = new Blob([content || ''], {type: mime});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = `docstruct_export_${Date.now()}.${ext}`;
                    a.click(); URL.revokeObjectURL(url);
                },

                showToast(msg) {
                    this.toast.msg = msg; this.toast.show = true;
                    setTimeout(() => this.toast.show = false, 3000);
                }
            }
        }
    </script>
</body>
</html>
